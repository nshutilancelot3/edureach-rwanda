{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block content %}
<h1>{{ icon('pencil', 24) }} {{ quiz.title }}</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for qn in questions %}
  <fieldset class="card">
    <legend>{{ loop.index }}. {{ qn.prompt }}</legend>
    {% for k in ['a','b','c','d'] %}{% if qn['option_' ~ k] %}
    <label class="choice"><input type="radio" name="q{{ qn.id }}" value="{{ k }}" {{ 'checked' if chosen.get(qn.id|string) == k }}>
      <span><b>{{ k|upper }}</b> {{ qn['option_' ~ k] }}</span></label>
    {% endif %}{% endfor %}
  </fieldset>
  {% endfor %}
  <button class="big">{{ t('submit') }} {{ icon('send') }}</button>
</form>
{% endblock %}
